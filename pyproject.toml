[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "roadmap-ai"
version = "0.1.0"
description = "Generador local de roadmaps académicos con fuentes legales y trazables."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoadmapAI contributors" }]
keywords = ["roadmap", "education", "rag", "cli", "academic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "rich>=13.7,<15.0",
  "sqlmodel>=0.0.21,<1.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10.0",
  "pytest-asyncio>=0.23,<2.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.5,<1.0",
]

[project.scripts]
roadmap = "roadmap_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/roadmap_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["roadmap_ai"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
